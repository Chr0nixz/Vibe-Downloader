<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Vibe Downloader</strong>
        <span id="status">__MSG_statusReady__</span>
      </header>
      <section id="capture-controls" aria-label="Capture settings" class="controls" hidden>
        <label>
          <input id="auto-intercept" type="checkbox" />
          <span>__MSG_autoCapture__</span>
        </label>
        <label>
          <span>__MSG_cookiesHeaders__</span>
          <select id="forward-headers-mode">
            <option value="ask">__MSG_forwardAsk__</option>
            <option value="enabled">__MSG_forwardEnabled__</option>
            <option value="disabled">__MSG_forwardDisabled__</option>
          </select>
        </label>
      </section>
      <button id="send-current" type="button">__MSG_sendCurrentPage__</button>
      <section aria-label="Live tasks">
        <div class="section-title">__MSG_liveSection__</div>
        <ol id="live-tasks"></ol>
      </section>
      <section id="media-candidates-section" aria-label="Detected media" hidden>
        <div class="section-title">__MSG_mediaSection__</div>
        <ul id="media-candidates-list" class="media-candidates-list"></ul>
        <p id="no-media-candidates" class="recent-meta">__MSG_noMediaCandidates__</p>
      </section>
      <section aria-label="Recent handoffs">
        <div class="section-title">__MSG_recentSection__</div>
        <ol id="recent-tasks"></ol>
      </section>
      <footer>
        <button id="open-options" type="button">__MSG_optionsButton__</button>
      </footer>
    </main>
    <script src="logger.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
