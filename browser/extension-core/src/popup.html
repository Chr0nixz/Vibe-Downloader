<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Vibe Downloader</strong>
        <span id="status">Ready</span>
      </header>
      <section id="capture-controls" aria-label="Capture settings" class="controls" hidden>
        <label>
          <input id="auto-intercept" type="checkbox" />
          <span>Auto capture</span>
        </label>
        <label>
          <span>Cookies & headers</span>
          <select id="forward-headers-mode">
            <option value="ask">Ask first</option>
            <option value="enabled">Forward</option>
            <option value="disabled">Do not forward</option>
          </select>
        </label>
      </section>
      <button id="send-current" type="button">Send current page</button>
      <section aria-label="Live tasks">
        <div class="section-title">Live</div>
        <ol id="live-tasks"></ol>
      </section>
      <section aria-label="Recent handoffs">
        <div class="section-title">Recent</div>
        <ol id="recent-tasks"></ol>
      </section>
    </main>
    <script src="logger.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
