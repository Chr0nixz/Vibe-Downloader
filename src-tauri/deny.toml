# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check licenses advisories

[advisories]
# vulnerability, unsound, and notice advisories always emit errors and cannot
# be downgraded; use the `ignore` list to suppress specific advisory IDs.
# Fail CI on yanked crates; limit unmaintained/unsound failures to workspace deps.
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # quick-xml <0.41 DoS vulnerabilities (RUSTSEC-2026-0194, RUSTSEC-2026-0195).
    # Our direct dep is 0.41.0 (patched). These remain in transitive deps:
    #  - tauri-winrt-notification 0.7.2 (toast notification XML, not attacker-controlled)
    #  - librqbit-upnp 9.0.0-rc.0 (local UPnP, not internet-facing)
    # Upstream must release new versions to pick up quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rsa Marvin Attack timing sidechannel (RUSTSEC-2023-0071).
    # No safe upgrade available — russh 0.61.2 pins rsa 0.10.0-rc.18.
    # This is a desktop download manager where the user initiates SFTP
    # connections to their own servers; the attack requires observing many
    # timings over the network. Accept until russh ships a patched rsa.
    "RUSTSEC-2023-0071",
    # ringbuf double-free on panicking Drop in Consumer::skip/clear
    # (RUSTSEC-2026-0293).
    # No safe upgrade available — librqbit-utp 0.7.0 pins ringbuf ^0.4.7;
    # the fix (0.5.2) requires a librqbit 9.0.0-rc.0 -> 9.x BT engine
    # upgrade, which is out of scope for a dependency bump. The bug needs
    # an element's Drop impl to panic mid-skip; librqbit-utp only stores
    # plain network buffers there. Accept until librqbit releases a
    # version that allows ringbuf 0.5.
    "RUSTSEC-2026-0293",
    # TEMPORARY (added 2026-10-18, approved by Chen): zip 4.6.1
    # vulnerabilities via tauri-plugin-updater's `zip ^4` requirement.
    # GHSA-vv5m-jxxh-4627, GHSA-4v9h-p7m9-rh26, GHSA-4684-h2q9-2vcp:
    # SUID/SGID preservation, symlink target escape, and permission
    # application through symlinks during ZIP extraction.
    # Our direct zip dep is 9.0.4 (not flagged). The 4.6.1 copy is only
    # used by tauri-plugin-updater for extracting update artifacts.
    # REMOVE once tauri-plugin-updater releases a version requiring
    # zip 9 (or a patched 4.x). Upstream has not reacted as of 2026-10-18;
    # zip maintainers temporarily unyanked 4.6.1 until 2026-10-30.
    "GHSA-vv5m-jxxh-4627",
    "GHSA-4v9h-p7m9-rh26",
    "GHSA-4684-h2q9-2vcp",
]

[licenses]
# Allow common permissive licenses compatible with the project's GPL-3.0-only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-only",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions (common in large trees); allow wildcards.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
