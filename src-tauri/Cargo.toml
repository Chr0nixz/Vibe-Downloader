[package]
name = "vibe-downloader"
version = "0.3.0"
description = "Vibe Downloader - modern desktop download manager"
authors = ["Chr0nixz"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "vibe-downloader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "socks", "stream", "system-proxy"] }
hls_m3u8 = "0.7.0"
aes = "0.9.1"
cbc = { version = "0.2.1", features = ["alloc"] }
suppaftp = { version = "9.0.0", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
webpki-roots = "1.0.8"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "net", "process", "sync", "time", "macros", "rt-multi-thread"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "chrono", "uuid"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
shlex = "1"
tracing-appender = "0.2"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
keyring = "4"
librqbit = { version = "9.0.0-rc.0", default-features = false, features = ["rust-tls"] }
quick-xml = "0.41.0"
russh = "0.61.2"
russh-sftp = "2.3.0"
trash = "5.2.6"
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
thiserror = "2"
fs4 = "1"
tokio-socks = "0.5"

# System file icon extraction. Target-specific so each platform only pulls
# in what it needs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSData", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSBitmapImageRep"] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop = { version = "0.0.3", default-features = false, features = ["icon"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }


[dev-dependencies]
serial_test = "3"
rand = "0.10"

[profile.release]
# Optimize for smaller binaries and better runtime throughput on a desktop
# download manager. These flags only apply to `cargo build --release` and
# the Tauri release bundle; `cargo build` / `pnpm tauri dev` keep their
# fast debug defaults.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
