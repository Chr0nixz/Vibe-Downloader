[package]
name = "vibe-downloader"
version = "0.1.0"
description = "Vibe Downloader - modern desktop download manager"
authors = ["Chr0nixz"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "vibe-downloader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "socks", "stream", "system-proxy"] }
hls_m3u8 = "0.7.0"
aes = "0.9.1"
cbc = { version = "0.2.1", features = ["alloc"] }
suppaftp = { version = "8.0.4", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
webpki-roots = "1.0.4"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "net", "process", "sync", "time", "macros", "rt-multi-thread"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "chrono", "uuid"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
axum = { version = "0.8.7", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
keyring = "3"
librqbit = { version = "9.0.0-rc.0", default-features = false, features = ["rust-tls"] }
magnet-url = "3.0.0"
quick-xml = "0.39"
russh = "0.55"
russh-sftp = "2.1.1"

[dev-dependencies]
