# ENG-01: dependency advisories were only scanned on push/PR events, so a
# newly published advisory sat unnoticed until the next code change. This
# workflow re-scans on a schedule and on demand.
name: Security scan

on:
  schedule:
    # Weekly, Mondays 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  cargo-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Scan Rust dependencies for security advisories
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories
