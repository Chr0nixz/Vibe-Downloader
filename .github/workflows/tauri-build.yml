name: Tauri Build

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-build-matrix:
    name: tauri-build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VIBE_BROWSER_PROFILE: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --config src-tauri/tauri.ci.conf.json
      - name: Verify Windows installer sidecar
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "Tauri build did not produce an MSI" }
          $extract = Join-Path $env:RUNNER_TEMP "vibe-msi-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$extract`"")
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed with $($process.ExitCode)" }
          $host = Get-ChildItem $extract -Recurse -Filter vibe-native-host.exe | Select-Object -First 1
          if (-not $host) { throw "MSI does not contain vibe-native-host.exe" }
          & $host.FullName --self-check
      - name: Verify macOS app sidecar
        if: matrix.platform == 'macos'
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          test -x "$app_path/Contents/MacOS/vibe-native-host"
          "$app_path/Contents/MacOS/vibe-native-host" --self-check
      - name: Verify Linux package sidecars
        if: matrix.platform == 'linux'
        run: |
          deb_path="$(find src-tauri/target/release/bundle -name '*.deb' -print -quit)"
          test -n "$deb_path"
          mkdir -p "$RUNNER_TEMP/vibe-deb-extract"
          dpkg-deb -x "$deb_path" "$RUNNER_TEMP/vibe-deb-extract"
          deb_host="$(find "$RUNNER_TEMP/vibe-deb-extract" -type f -name vibe-native-host -print -quit)"
          test -x "$deb_host"
          "$deb_host" --self-check

          appimage_path="$(find src-tauri/target/release/bundle -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          chmod +x "$appimage_path"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$appimage_path" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/vibe-native-host
          squashfs-root/usr/bin/vibe-native-host --self-check
