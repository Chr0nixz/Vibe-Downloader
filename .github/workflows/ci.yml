name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ENG-06: the aggregate script is the single canonical check list; the
      # steps it runs mirror this job one-to-one (typecheck, lint, vitest,
      # release-tools, i18n, protocol matrix, version sync, doc gate, build,
      # bundle budget, extensions).
      - run: pnpm verify:frontend
      # ENG-04: coverage is collected as an artifact only; no threshold is
      # enforced in CI yet (see audit ENG-04 for the baseline ratchet plan).
      - name: Frontend coverage
        run: pnpm test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  rust:
    strategy:
      fail-fast: false
      # ENG-01: macOS ships objc2 platform code that was previously compiled
      # only in release builds — never tested, never clippy-checked.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg
      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y --no-progress
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # ENG-04: report-only coverage; thresholds stay a local ratchet for now.
      - name: Rust coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --lcov --output-path lcov.info
      - name: Upload rust coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 7
      - name: Check licenses, advisories, bans and sources
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories bans sources
      # ENG-06: fmt check + clippy --all-targets + tests live in the aggregate
      # script so local runs and CI cannot drift apart.
      - run: pnpm verify:rust
      # ENG-01: bindings regeneration is newline-sensitive; running it on every
      # OS turned CRLF checkouts into false failures and cost extra specta runs.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check:bindings
